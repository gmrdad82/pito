en:
  pito:
    shell:
      chatbox:
        placeholder: "Type a command or message…"
        default_channel: "@all"
        hints:
          login: "/login 123456 to log in"
          help: "/help to see available commands"
        filter:
          channel_label: "Channel"
          period_label: "Period"
          # Both cyclers unify on the SAME physical shortcut (owner 2026-07-24)
          # — ctrl+space cycles channel OR period depending on the typed verb
          # context (chatbox_hints_controller#mode). Formatted through
          # Pito::Keybinding::Glyph at render time (ShortcutComponent).
          channel_shortcut: "ctrl+space"
          period_shortcut: "ctrl+space"
        no_channels: "none"
      mini_status:
        authenticated: "%{tag}"
        anonymous: "tarnished"
        notifications_count:
          one: "%{count}"
          other: "%{count}"
        notifications_hint: "ctrl+/"
        notifications_open: "Open notifications"
        chat_hint: "m"
        chat_label: "chat"
        commands_hint: "ctrl+k"
        commands_label: "commands"
        separator: "·"
