# FX registry — the living background's single ontology (2.1.0). The message
# event only ever says WHAT it is (its fx context, stamped server-side —
# Option B); THIS file alone decides which effects may render it and how they
# behave. Adding an effect or remapping a context is a YAML edit — never a
# Ruby/JS conditional.
#
# ── HOW TO EDIT (owner's manual) ────────────────────────────────────────────
# Three sections, three walls (all validated at BOOT by Pito::Fx::Registry and
# specced in spec/lib/pito/fx/registry_spec.rb — a bad edit fails loudly with
# a did-you-mean, never degrades silently):
#
#   effects:   what each mood IS and what it needs. `covers:` is the law of
#              the land — single | many | none:
#                single — the mood renders ONE cover (water).
#                many   — the mood renders a SET of covers (none ship).
#                none   — the mood needs no art (sky, plasma).
#   contexts:  what each kind of message CARRIES (`covers:` again) and its
#              weighted mood pool. A `single` mood may ONLY be pooled on a
#              `single` context; a `many` mood only on a `many` context;
#              `none` moods go anywhere. Water on a list is a BOOT ERROR.
#   engine:    global physics (clock, crossfade, flock).
#
# ── THE 5.0.0 CULL (owner ruling 2026-07-26) ────────────────────────────────
# THREE MOODS SHIP: sky (with its flock and its idle rings), plasma, water.
# duotone, lens, glow, trails, aurora, globs and cover_wall are GONE — their
# entries here and their renderer modules under app/javascript/fx/renderers/
# were deleted together. The 2026-07-13 OWNER LOCKS on duotone and lens are
# retired with the effects themselves; water's lock stands, knobs untouched.
#
# What the cull buys, and why the pools below all hold exactly one entry:
# every context now resolves to ONE viable effect, so fx/engine.js's seeded
# pick (`fnv1a("fx:<eventId>:<context>")`) has nothing left to roll. The mood
# a conversation wears is a pure function of (context, does it carry art,
# what the device can run) — never of which event id happened to land. The
# scrollback's `data-fx-context` / `data-fx-covers` attributes are therefore
# a COMPLETE description of its background, which is exactly what the L2
# snapshot (Pito::Stream::ScrollbackCache) stores.
#
# THE SKY IS SPELLED, NEVER IMPLIED. `sky` is a declared effect but has no
# renderer module (it lives at app/javascript/fx/sky.js and is painted by the
# controller's own resting pass), so fx/engine.js's viable() always filters it
# out and the empty pool falls through to the sky. Pooling `{ effect: sky }`
# is how a context SAYS "this is a sky moment" — a non-empty pool the
# validator accepts, that can never win a roll. `default` has always worked
# this way; the cull gives four more contexts the same shape.
schema_version: 2

# Global engine knobs (F9/F6): the fx clock never exceeds fps; canvas backing
# store is capped at dpr_cap; context swaps crossfade over crossfade_ms after
# a message has been viewport-dominant for hysteresis_ms.
engine:
  fps: 30
  dpr_cap: 1.0
  crossfade_ms: 700
  hysteresis_ms: 300
  # Moods are BACKGROUNDS: every enforcer composites at most this alpha
  # (owner readability round 2 — full-blast covers drowned thin text).
  enforcer_alpha: 0.62
  # Butterfly-body ceiling (owner: "like 6 of them, in different sizes,
  # never colliding"); each page load rolls a flock of 3..this. The FIRST is
  # the leader every effect follows and the mouse leans. KEPT by the 5.0.0
  # cull — the flock is part of the sky, not a mood of its own.
  butterflies: 6
  # The rings show over the NIGHT SKY only, and only once the conversation
  # has been idle this long — activity fades them out, idling fades them
  # back in (owner 2026-07-13). KEPT by the 5.0.0 cull.
  ring_idle_ms: 8000
  # The CABLE PUSH (2026-07-19, owner: "random per butterfly, random per
  # payload event, random in everything — push tilt pull move whatever"):
  # every received Turbo Stream (fx/impulse.js's planCablePush) rolls each
  # flock member an independent push/pull/tilt/move/sit-out reaction. These
  # are the only two tunable ranges — strength feeds kick magnitude AND
  # pull/tilt bias weight; duration_ms feeds how long a pull/tilt lean (or a
  # "move" leg) lasts. New knobs, no prior value to compare against.
  cable_push_strength_min: 0.35
  cable_push_strength_max: 0.85
  cable_push_duration_ms_min: 400
  cable_push_duration_ms_max: 1600

# Every effect the engine can mount.
#   engine:      css | canvas | webgl — which renderer family drives it.
#   covers:      single | many | none — the cover-cardinality law (above).
#   needs_float: WebGL EXT_color_buffer_float required (degrades to another
#                pool entry when absent).
#   tint_source: theme | cover | fixed — where the palette comes from.
#
# NOTE: no `many` effect ships after the 5.0.0 cull. The cardinality itself
# stays legal (the validator, the guard and engine.js's viable() all still
# understand it) so a future wall is a YAML edit again — but nothing today
# demands art it cannot be given.
effects:
  sky:
    engine: canvas
    covers: none
    needs_float: false
    tint_source: fixed
    # Owner-tuned (2026-07-13): the resting drift at half the TUI cadence —
    # a slower, calmer glide. tilt_gain scales the sky's sway with the
    # LEADER butterfly (no mood reads the device directly; the hand reaches
    # everything through the flock).
    # Owner-authorized perf cut (2026-07-19): cell was 16 — coarser sampling
    # cells trade ~46% of drawSky's per-frame starAt/paint work (1920x1080:
    # 16456 -> 8900 starAt calls) for a somewhat sparser field that still
    # reads full. density held steady — the cell cut alone clears the target.
    knobs:
      drift_scale: 0.5
      tilt_gain: 3.0
      cell: 22
      density: 80
  plasma:
    engine: webgl
    covers: none
    needs_float: false
    tint_source: theme
  # LOCKED (owner 2026-07-13, lock re-affirmed by the 5.0.0 cull): a pond,
  # not a downpour — rare gentle drops, slow fat waves, high damping. The
  # one mood that wears cover art.
  water:
    engine: webgl
    covers: single
    needs_float: true
    tint_source: cover
    knobs:
      damping: 0.985
      drop_interval_ms: 1600
      drop_strength: 0.07
      drop_radius: 0.055

# Context → { covers, pool } (F8: seeded per-event pick — after the 5.0.0
# cull no pool offers more than ONE renderable effect, so the seed decides
# nothing and the mood is stable for the whole conversation). The engine
# falls back to the sky for any context absent here (F1), and `default` IS
# the sky — start_screen, not_found, anything that doesn't fit.
#
# `covers:` declares what the context CARRIES — it describes the PAYLOAD, not
# the pool. Pito::Fx::Context still resolves and stamps a wall of cover paths
# for the list/channel contexts below, so `many` remains the honest word for
# them even though no `many` effect survives to wear it; the registry refuses
# any pool entry whose effect demands more than the context has.
contexts:
  # ── Single-cover moments: water, and only water. ──
  game_detail:
    covers: single
    pool:
      - { effect: water, weight: 1 }
  # A vid's art is its LINKED GAME's art (Pito::Fx::Context#vid_covers), so a
  # vid with no game link resolves to zero covers. Owner ruling 2026-07-26:
  # water only when the vid resolves to a game, otherwise the sky. That is
  # exactly what fx/engine.js's viable() already does — a `covers: single`
  # effect with zero covers is non-viable, the pool empties, the sky answers
  # — so the rule is the degrade, not a second code path. `sky` is spelled
  # out here to say so at the point of use.
  vid_detail:
    covers: single
    pool:
      - { effect: water, weight: 1 }
      - { effect: sky, weight: 1 }
  # Analyze twins its show counterpart VERBATIM (owner 2026-07-13).
  analyze_game:
    covers: single
    pool:
      - { effect: water, weight: 1 }
  analyze_vid:
    covers: single
    pool:
      - { effect: water, weight: 1 }
      - { effect: sky, weight: 1 }

  # ── Many-cover moments: the wall is gone, so these are sky moments. ──
  # The payload still CARRIES its wall of covers (see the `covers:` note
  # above); nothing renders them, and the sky is the whole answer.
  game_list:
    covers: many
    pool:
      - { effect: sky, weight: 1 }
  vid_list:
    covers: many
    pool:
      - { effect: sky, weight: 1 }
  channel:
    covers: many
    pool:
      - { effect: sky, weight: 1 }

  # ── Cover-less moments. ──
  # Analyze channel twins show channel (owner 2026-07-13) — the derive
  # layer hands it the same linked-games wall covers. Bare analyze
  # (breakdowns, multi-entity) has NO entry: absent = the sky (F1).
  analyze_channel:
    covers: many
    pool:
      - { effect: sky, weight: 1 }
  # The AI family wears PLASMA (owner ruling 2026-07-26 — glow, globs, trails
  # and aurora are culled). ai_game keeps its own context because the derive
  # layer still distinguishes it and because plasma is `covers: none`: the
  # game's cover rides the payload, plasma simply doesn't read it.
  ai_game:
    covers: single
    pool:
      - { effect: plasma, weight: 1 }
  ai:
    covers: none
    pool:
      - { effect: plasma, weight: 1 }
  default:
    covers: none
    pool:
      - { effect: sky, weight: 1 }
